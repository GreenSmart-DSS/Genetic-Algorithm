# ============================================================
# Levy function example (5 inputs).
# Minimize sin^2(pi*w1) + sum[(w_i-1)^2 (1+10 sin^2(pi w_i+1))]
#        + (w_n-1)^2 (1+sin^2(2*pi*w_n)),  w_i = 1+(x_i-1)/4
# Global minimum 0 at (1,1,...,1). Narrow global basin inside
# a multimodal landscape — tests precision near the optimum.
# ============================================================

# --- objective ------------------------------------------------
objective_file: objective_functions.py
objective_function: levy
sense: minimize

# --- population & stopping -----------------------------------
pop_size: 150
max_generations: 1500
no_improve_limit: 120

# --- selection ------------------------------------------------
selection: tournament
tournament_size: 3
elitism: 4

# --- genetic operators ---------------------------------------
crossover_rate: 0.9
crossover: blend         # blend narrows in on the optimum
                         # through interpolation/extrapolation
mutation_rate: 0.15

# --- randomness & output -------------------------------------
seed: 42
save_history: true
plot: true
verbose: true
outdir: results_levy

# --- variables ------------------------------------------------
# Standard Levy domain: [-10, 10] per variable.
# The optimum at (1,1,...,1) is off-center in the domain.
variables:
  - { name: x1, dtype: float, lb: -10.0, ub: 10.0 }
  - { name: x2, dtype: float, lb: -10.0, ub: 10.0 }
  - { name: x3, dtype: float, lb: -10.0, ub: 10.0 }
  - { name: x4, dtype: float, lb: -10.0, ub: 10.0 }
  - { name: x5, dtype: float, lb: -10.0, ub: 10.0 }
