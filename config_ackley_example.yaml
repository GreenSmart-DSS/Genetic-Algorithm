# ============================================================
# Ackley function example (5 inputs).
# Minimize  -20 exp(-0.2 sqrt(mean(x^2)))
#            - exp(mean(cos(2*pi*x))) + 20 + e
# Global minimum 0 at the origin. Nearly flat outer region
# with a deep narrow hole at the center — tests whether the
# GA can locate a small basin in a vast search space.
# ============================================================

# --- objective ------------------------------------------------
objective_file: objective_functions.py
objective_function: ackley
sense: minimize

# --- population & stopping -----------------------------------
pop_size: 150
max_generations: 1500
no_improve_limit: 120

# --- selection ------------------------------------------------
selection: tournament
tournament_size: 3
elitism: 4

# --- genetic operators ---------------------------------------
crossover_rate: 0.9
crossover: blend          # blend works well for the wide
                          # [-32, 32] domain
mutation_rate: 0.15

# --- randomness & output -------------------------------------
seed: 42
save_history: true
plot: true
verbose: true
outdir: results_ackley

# --- variables ------------------------------------------------
# Standard Ackley domain: [-32, 32] per variable.
variables:
  - { name: x1, dtype: float, lb: -32.0, ub: 32.0 }
  - { name: x2, dtype: float, lb: -32.0, ub: 32.0 }
  - { name: x3, dtype: float, lb: -32.0, ub: 32.0 }
  - { name: x4, dtype: float, lb: -32.0, ub: 32.0 }
  - { name: x5, dtype: float, lb: -32.0, ub: 32.0 }
